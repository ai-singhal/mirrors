[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "mirrors-ledger"
version = "0.2.0"
description = "Python runtime bridges for the local Mirrors behavioral ledger"
requires-python = ">=3.10"
license = "MIT"
[project.optional-dependencies]
pydantic = ["pydantic-ai-slim>=2.43,<3"]
langgraph = ["langgraph>=1,<2", "langchain-core>=1,<2"]
[tool.setuptools.packages.find]
where = ["."]
include = ["mirrors*"]
